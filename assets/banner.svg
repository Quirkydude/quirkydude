<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Clement Obeng: Full-Stack Developer, AI Builder, Systems Thinker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FCD116"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6edf3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.55" r="0.35">
      <stop offset="0" stop-color="#FCD116" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FCD116" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="win"><rect x="20" y="20" width="1160" height="300" rx="14"/></clipPath>

    <!-- line-by-line reveal -->
    <clipPath id="l1"><rect x="40" y="82" width="0" height="40"><animate attributeName="width" from="0" to="1100" begin="0.2s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="40" y="126" width="0" height="66"><animate attributeName="width" from="0" to="1100" begin="1.2s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="40" y="196" width="0" height="36"><animate attributeName="width" from="0" to="1100" begin="2.2s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="40" y="244" width="0" height="36"><animate attributeName="width" from="0" to="1100" begin="3.2s" dur="0.9s" fill="freeze"/></rect></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>

  <!-- window -->
  <g clip-path="url(#win)">
    <rect x="20" y="20" width="1160" height="300" fill="url(#bg)"/>
    <rect x="20" y="20" width="1160" height="300" fill="url(#glow)"/>
    <rect x="20" y="20" width="1160" height="42" fill="#161b22"/>
    <!-- Ghana stripe -->
    <rect x="20" y="312" width="387" height="8" fill="#CE1126"/>
    <rect x="407" y="312" width="386" height="8" fill="#FCD116"/>
    <rect x="793" y="312" width="387" height="8" fill="#006B3F"/>
  </g>
  <rect x="20.5" y="20.5" width="1159" height="299" rx="14" fill="none" stroke="#30363d"/>

  <!-- title bar -->
  <circle cx="48" cy="41" r="7" fill="#ff5f56"/>
  <circle cx="72" cy="41" r="7" fill="#ffbd2e"/>
  <circle cx="96" cy="41" r="7" fill="#27c93f"/>
  <text x="600" y="46" text-anchor="middle" class="mono" font-size="14" fill="#8b949e">clement@quirkydude: ~/ghana</text>

  <!-- black star of Ghana, outlined in gold -->
  <g transform="translate(1010 185)">
    <path d="M0,-80 L18.8,-25.9 L76.1,-24.7 L30.4,9.9 L47,64.7 L0,32 L-47,64.7 L-30.4,9.9 L-76.1,-24.7 L-18.8,-25.9 Z"
          fill="#0d1117" stroke="#FCD116" stroke-width="2.5" stroke-linejoin="round" opacity="0.55">
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- terminal lines -->
  <g class="mono">
    <text x="60" y="110" font-size="24" clip-path="url(#l1)">
      <tspan fill="#3fb950">~/ghana</tspan><tspan fill="#8b949e"> $ </tspan><tspan fill="#e6edf3">whoami</tspan>
    </text>
    <text x="58" y="178" font-size="60" font-weight="700" fill="url(#name)" clip-path="url(#l2)">Clement Obeng</text>
    <text x="60" y="222" font-size="22" fill="#8b949e" clip-path="url(#l3)">
      Full-Stack Developer <tspan fill="#FCD116">·</tspan> AI Builder <tspan fill="#FCD116">·</tspan> Systems Thinker
    </text>
    <text x="60" y="270" font-size="22" clip-path="url(#l4)">
      <tspan fill="#3fb950">~/ghana</tspan><tspan fill="#8b949e"> $ </tspan><tspan fill="#e6edf3">ship --web --mobile --ai</tspan><tspan fill="#58a6ff"> ▋<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></tspan>
    </text>
  </g>
</svg>
